name: astrbot_plugin_xavier_moment
display_name: Moment
desc: 让他和你都能发布动态、互相评论，分享日常生活；支持 NPC 评论与接话、评论区回灌私聊（附他此刻的生活状态）、把真实三餐偶尔当发帖话题，发动态时自动配图（会读「小回相机」的参考图，可在面板指定固定参考图并一次带多张），时间线支持手动刷新、帖子按 YYMMDD HH:MM 显示。
short_desc: 他与你的私密朋友圈（含 NPC 评论与配图）
version: v2.2.0
author: 源源
repo: https://github.com/mmaoqiuu/Xavier_moment
